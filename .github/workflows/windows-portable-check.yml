name: Windows portable offline check
run-name: Windows portable check ${{ inputs.probe_id || 'offline' }}
on:
  workflow_dispatch:
    inputs:
      probe_id:
        description: Non-sensitive identifier for this acceptance run
        type: string
        default: offline
      real_account:
        description: Run authorized three-region reads using a temporary probe secret
        type: boolean
        default: false
concurrency:
  group: windows-portable-acceptance
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the published preview archive
        shell: pwsh
        run: |
          $url = 'https://github.com/stonesver/ournotes-growth-exporter/releases/download/v0.2.0-alpha.2/ournotes-growth-windows-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile tool.zip
          $actual = (Get-FileHash tool.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '75fbb5eec1ac9adc752c7738acb01e97e6d654e109903b82f05025c05e2c70a0') { throw 'Release checksum mismatch' }
          Expand-Archive tool.zip -DestinationPath extracted
      - name: Run the bundled interpreter without credentials
        shell: pwsh
        run: |
          Set-Location extracted/ournotes-growth-windows-x64
          & ./runtime/python.exe -I -B launcher.py --self-test --require-bundled-sdk
          if ($LASTEXITCODE -ne 0) { throw 'Portable self-test failed' }
      - name: Verify three-region reads with the shipped launcher and bundled SDK
        if: ${{ inputs.real_account }}
        shell: pwsh
        env:
          GROWTH_WINDOWS_PROBE_JSON: ${{ secrets.GROWTH_WINDOWS_PROBE_JSON }}
        run: |
          & ./extracted/ournotes-growth-windows-x64/runtime/python.exe -I -B .github/scripts/verify_windows_release.py extracted/ournotes-growth-windows-x64 tool.zip
          if ($LASTEXITCODE -ne 0) { throw 'Windows three-region acceptance failed; consult the bounded result above' }
