name: Windows portable offline check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download the published preview archive
        shell: pwsh
        run: |
          $url = 'https://github.com/stonesver/ournotes-growth-exporter/releases/download/v0.1.0-alpha.3/ournotes-growth-windows-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile tool.zip
          $actual = (Get-FileHash tool.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'eb349cfa28109f85ae28e42da36f9b6bd09fca6556ebf74e5d14d89e0d2df8ce') { throw 'Release checksum mismatch' }
          Expand-Archive tool.zip -DestinationPath extracted
      - name: Run the bundled interpreter without credentials
        shell: pwsh
        run: |
          Set-Location extracted/ournotes-growth-windows-x64
          & ./runtime/python.exe -I -B launcher.py --self-test --require-bundled-sdk
          if ($LASTEXITCODE -ne 0) { throw 'Portable self-test failed' }
